<mat-card class="card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>My Tasks</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="header">
      <a mat-flat-button color="primary" routerLink="/tasks/new">
        <mat-icon>add</mat-icon>
        Add Task
      </a>
    </div>
    @if (taskService.tasks().length === 0) {
      <p>No tasks yet.</p>
    } @else {
      <mat-list>
        @for (task of taskService.tasks(); track task.id) {
          <mat-list-item>
            <mat-icon matListItemIcon color="primary">task_alt</mat-icon>
            <span matListItemTitle>{{ task.title }}</span>
            <span matListItemLine>{{ task.description }}</span>
            <div matListItemMeta>
              <button mat-icon-button color="warn" (click)="taskService.delete(task.id!)">
                <mat-icon>delete</mat-icon>
              </button>
              <a mat-icon-button color="primary" [routerLink]="['/tasks', task.id, 'edit']">
                <mat-icon>edit</mat-icon>
              </a>
            </div>
          </mat-list-item>
        }
      </mat-list>
    }
  </mat-card-content>
</mat-card>
