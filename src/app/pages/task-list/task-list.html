<mat-card class="card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>My Tasks</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (taskService.tasks().length === 0) {
      <p>No tasks yet.</p>
    } @else {
      <mat-list>
        @for (task of taskService.tasks(); track task.id) {
          <mat-list-item>
            <mat-icon matListItemIcon color="primary">task_alt</mat-icon>
            <span matListItemTitle>{{ task.title }}</span>
            <span matListItemLine>{{ task.description }}</span>
            <button mat-icon-button color="warn" matListItemMeta (click)="taskService.delete(task.id!)">
              <mat-icon>delete</mat-icon>
            </button>
          </mat-list-item>
        }
      </mat-list>
    }
  </mat-card-content>
</mat-card>
